name: Atualizar Promocoes Ybera

on:
  schedule:
    # Roda automaticamente todo dia às 06:00 da manhã (horário UTC)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite que você clique em "Run workflow" para rodar na hora que quiser

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: pip install requests beautifulsoup4

      - name: Executar Robô
        run: python bot_ybera.py

      - name: Salvar e Publicar alterações
        run: |
          git config --global user.name 'Robo-Ybera'
          git config --global user.email 'bot@noreply.github.com'
          git add produtos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Produtos atualizados" && git push)
